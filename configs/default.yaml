# default.yaml — Master config for the inpainting pipeline
# One flag = one change. No code surgery for ablations.


# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  content_image:  "inputs/source.jpg"
  donor_image:    "inputs/reference.jpg"
  artifacts_dir:  "artifacts/"              # stage1 + stage1b write here; stage2 reads from here
  output_dir:     "outputs/"
  sam_checkpoint: "sam_vit_h_4b8939.pth"
  sam_model_type: "vit_h"                   # "vit_h" | "vit_l" | "vit_b" | "mobile"


# ── Image ─────────────────────────────────────────────────────────────────────
image:
  target_size: 512     # 512 for sd-2-inpainting | 768 for sd-2-inpainting-768


# ── Donor alignment ───────────────────────────────────────────────────────────
# "resize" | "tile" | "match" (requires cv2) | "flow" | "affine"
alignment:
  method: "resize"


# ── Stage 1: Segmentation only ────────────────────────────────────────────────
# Decomposition and prior construction removed — texture enters via KV injection.
stage1:
  sam:
    prompt_strategy:        "center_point"   # "text" | "center_point" | "bbox"

    # text prompt (prompt_strategy: "text" only — requires Grounding DINO)
    text_prompt:            ""
    grounding_dino_config:  "GroundingDINO_SwinT_OGC.py"
    grounding_dino_weights: "groundingdino_swint_ogc.pth"
    box_threshold:          0.35
    text_threshold:         0.25

    pred_iou_thresh:        0.88
    stability_score_thresh: 0.95
    dilation_px:            0                # pixels to dilate mask outward; 0 = no dilation


# ── Stage 1b: DDIM inversion ──────────────────────────────────────────────────
# Runs after stage1. Inverts donor_aligned.png and stores K,V per timestep
# to artifacts/kv_store/ for use by stage2.
stage1b:
  base_model_id:       "Manojb/stable-diffusion-2-1-base"  # 4-channel base UNet for inversion
  num_inversion_steps: 30    # should match stage2.num_inference_steps
  torch_dtype:         "float16"
  enable_cpu_offload:  false


# ── Stage 2: Diffusion pipeline ───────────────────────────────────────────────
stage2:
  model_id:            "stable-diffusion-v1-5/stable-diffusion-inpainting"
  torch_dtype:         "float16"     # "float16" | "float32"
  enable_cpu_offload:  false

  scheduler:           "DDIM"        # "DDIM" | "PNDM" | "DPMSolver"

  prompt:          "photorealistic surface texture, sharp fine detail, natural lighting"
  negative_prompt: "blurry, smooth, flat color, cartoon, low quality, artifacts"

  num_inference_steps: 30
  denoising_strength:  0.75
  anchor_feather_px:   24
  guidance_scale:      7.5
  seed:                42


# ── KV Injection ──────────────────────────────────────────────────────────────
# injection_scale: global λ for shallow KV blending. A6 sweep: [0.3, 0.5, 0.8, 1.0]
injection:
  injection_scale: 0.8


# ── Compositing ───────────────────────────────────────────────────────────────
compositing:
  poisson_blend:   true
  feather_px:      16
  seam_threshold:  10.0
  auto_skip:       false


# ── Ablation flags ────────────────────────────────────────────────────────────
ablation:

  # A2 — Depth routing: "correct" | "swapped" | "uniform"
  # Read by kv_cache.depth_routing. stage2 currently hardcodes "correct".
  depth_routing: "correct"

  # A3 — Spatial injection mask: "sam" | "none"
  mask_type: "sam"

  # A4 — Temporal lambda annealing
  # false = flat λ_HF (principled default — KV is timestep-calibrated from inversion)
  # true  = ramp 0 → injection_scale (ablation comparison only)
  temporal_anneal: false

  # A6 — Blended latent anchoring
  # true  : per-step latent replacement outside mask
  # false : one-time img2img init only
  blended_anchoring: true

  # A7 — Shallow KV injection on/off
  shallow_injection: true

  # A9 — Compositing method: "freq" | "simple"
  compositing: "freq"


# ── Ablation sweep (ablation/ablation_runner.py) ──────────────────────────────
ablation_sweep:

  injection_scale: [0.3, 0.5, 0.8, 1.0]

  compositing_conditions:
    - { shallow_injection: false, compositing: "simple" }   # baseline
    - { shallow_injection: false, compositing: "freq"   }   # compositing only
    - { shallow_injection: true,  compositing: "simple" }   # injection only
    - { shallow_injection: true,  compositing: "freq"   }   # full method

  yaw_buckets:
    small:  [0,  15]
    medium: [15, 35]
    large:  [35, 999]


# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  save_intermediates: false
  verbose:            true
  save_meta:          true